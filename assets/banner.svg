<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#141420"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <!-- Gold gradient for text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a84b"/>
      <stop offset="40%" style="stop-color:#f5d98b"/>
      <stop offset="70%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#c8a84b"/>
    </linearGradient>
    <!-- Gold gradient vertical -->
    <linearGradient id="goldGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d98b"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
    <!-- PDF icon gradient -->
    <linearGradient id="pdfRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc2222"/>
      <stop offset="100%" style="stop-color:#881111"/>
    </linearGradient>
    <!-- Paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#ded8cc"/>
    </linearGradient>
    <!-- Divider gradient -->
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a84b;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#c8a84b;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#c8a84b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8a84b;stop-opacity:0"/>
    </linearGradient>

    <style>
      @keyframes floatDoc {
        0%   { transform: translateY(0px) rotate(-4deg); }
        50%  { transform: translateY(-10px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(-4deg); }
      }
      @keyframes floatDoc2 {
        0%   { transform: translateY(0px) rotate(3deg) scale(0.75); }
        50%  { transform: translateY(-8px) rotate(5deg) scale(0.75); }
        100% { transform: translateY(0px) rotate(3deg) scale(0.75); }
      }
      @keyframes shimmerGold {
        0%   { opacity: 0.85; }
        50%  { opacity: 1; }
        100% { opacity: 0.85; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes linePulse {
        0%   { opacity: 0.5; }
        50%  { opacity: 1.0; }
        100% { opacity: 0.5; }
      }
      @keyframes subtleDrift {
        0%   { transform: translateX(0); }
        50%  { transform: translateX(6px); }
        100% { transform: translateX(0); }
      }
      @keyframes bgPattern {
        0%   { opacity: 0.04; }
        50%  { opacity: 0.07; }
        100% { opacity: 0.04; }
      }

      .doc-main  { animation: floatDoc  4s ease-in-out infinite; transform-origin: center; }
      .doc-back  { animation: floatDoc2 5.5s ease-in-out infinite; transform-origin: center; }
      .title     { animation: shimmerGold 3s ease-in-out infinite; }
      .subtitle  { animation: fadeIn 1.2s ease forwards; }
      .badge     { animation: fadeIn 1.6s ease forwards; }
      .divline   { animation: linePulse 3s ease-in-out infinite; }
      .drift     { animation: subtleDrift 6s ease-in-out infinite; }
      .bgpat     { animation: bgPattern 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <!-- Subtle damask-style background pattern (circles + lines) -->
  <g class="bgpat">
    <circle cx="100" cy="50" r="60" fill="none" stroke="#c8a84b" stroke-width="0.5"/>
    <circle cx="100" cy="50" r="40" fill="none" stroke="#c8a84b" stroke-width="0.3"/>
    <circle cx="1100" cy="290" r="60" fill="none" stroke="#c8a84b" stroke-width="0.5"/>
    <circle cx="1100" cy="290" r="40" fill="none" stroke="#c8a84b" stroke-width="0.3"/>
    <circle cx="600" cy="170" r="130" fill="none" stroke="#c8a84b" stroke-width="0.2"/>
    <line x1="0" y1="170" x2="1200" y2="170" stroke="#c8a84b" stroke-width="0.2"/>
    <line x1="600" y1="0" x2="600" y2="340" stroke="#c8a84b" stroke-width="0.2"/>
  </g>

  <!-- Top + bottom gold border lines -->
  <rect x="0" y="0"   width="1200" height="3" fill="url(#goldGrad)" class="divline"/>
  <rect x="0" y="337" width="1200" height="3" fill="url(#goldGrad)" class="divline"/>

  <!-- ─── Left PDF Document — back (slightly behind) ─── -->
  <g class="doc-back" transform="translate(110, 45)">
    <!-- Paper -->
    <rect x="10" y="0" width="110" height="140" rx="5" fill="#d4ccb8" opacity="0.7"/>
    <!-- Corner fold -->
    <polygon points="95,0 120,25 95,25" fill="#b8b0a0" opacity="0.7"/>
    <!-- Inner lines -->
    <line x1="22" y1="40" x2="95" y2="40" stroke="#b0a898" stroke-width="1.5" opacity="0.5"/>
    <line x1="22" y1="55" x2="95" y2="55" stroke="#b0a898" stroke-width="1.5" opacity="0.5"/>
    <line x1="22" y1="70" x2="80" y2="70" stroke="#b0a898" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ─── Left PDF Document — main (front) ─── -->
  <g class="doc-main" transform="translate(65, 60)">
    <!-- Paper shadow -->
    <rect x="8" y="8" width="120" height="155" rx="5" fill="#000" opacity="0.25"/>
    <!-- Paper body -->
    <rect x="0" y="0" width="120" height="155" rx="5" fill="url(#paperGrad)"/>
    <!-- Corner fold cutout -->
    <polygon points="90,0 120,30 90,30" fill="#c8bfb0"/>
    <polygon points="90,0 120,30 120,0" fill="#e8e0d0"/>
    <!-- Ornate border on paper -->
    <rect x="6" y="6" width="108" height="143" rx="3" fill="none" stroke="#c8a84b" stroke-width="0.8" opacity="0.5"/>
    <!-- PDF Red Badge -->
    <rect x="0" y="28" width="62" height="30" rx="5" fill="url(#pdfRed)"/>
    <!-- Badge shine -->
    <rect x="2" y="30" width="58" height="8" rx="3" fill="white" opacity="0.15"/>
    <!-- PDF text on badge -->
    <text x="31" y="49" font-family="Arial Black, Arial" font-weight="900" font-size="16"
          fill="#f5d98b" text-anchor="middle" letter-spacing="1">PDF</text>
    <!-- Content lines -->
    <line x1="12" y1="72" x2="108" y2="72" stroke="#c0b8a8" stroke-width="1.5"/>
    <line x1="12" y1="85" x2="108" y2="85" stroke="#c0b8a8" stroke-width="1.5"/>
    <line x1="12" y1="98" x2="90"  y2="98" stroke="#c0b8a8" stroke-width="1.5"/>
    <line x1="12" y1="111" x2="100" y2="111" stroke="#c0b8a8" stroke-width="1.2"/>
    <line x1="12" y1="124" x2="80"  y2="124" stroke="#c0b8a8" stroke-width="1.2"/>
    <line x1="12" y1="137" x2="95"  y2="137" stroke="#c0b8a8" stroke-width="1.2"/>
  </g>

  <!-- ─── Center Text Block ─── -->
  <!-- Main title -->
  <text x="620" y="125"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="62"
        fill="url(#goldGrad)"
        text-anchor="middle"
        letter-spacing="4"
        class="title">PDF TOOL BOT</text>

  <!-- Gold divider line under title -->
  <rect x="360" y="140" width="520" height="2" rx="1" fill="url(#divGrad)" class="divline"/>

  <!-- Subtitle -->
  <text x="620" y="175"
        font-family="Georgia, serif"
        font-style="italic"
        font-size="18"
        fill="#c0b8a8"
        text-anchor="middle"
        class="subtitle">The Ultimate Telegram Document Engineering Suite</text>

  <!-- Stats row -->
  <g class="badge drift" transform="translate(0,0)">
    <!-- Badge 1 -->
    <rect x="340" y="200" width="165" height="34" rx="17" fill="#1e1e2e" stroke="#c8a84b" stroke-width="1.2"/>
    <text x="422" y="222" font-family="Arial, sans-serif" font-size="13" fill="#f5d98b" text-anchor="middle" font-weight="600">44+ Operations</text>

    <!-- Badge 2 -->
    <rect x="527" y="200" width="145" height="34" rx="17" fill="#1e1e2e" stroke="#c8a84b" stroke-width="1.2"/>
    <text x="599" y="222" font-family="Arial, sans-serif" font-size="13" fill="#f5d98b" text-anchor="middle" font-weight="600">Tesseract OCR</text>

    <!-- Badge 3 -->
    <rect x="684" y="200" width="155" height="34" rx="17" fill="#1e1e2e" stroke="#c8a84b" stroke-width="1.2"/>
    <text x="761" y="222" font-family="Arial, sans-serif" font-size="13" fill="#f5d98b" text-anchor="middle" font-weight="600">17 Languages</text>

    <!-- Badge 4 -->
    <rect x="851" y="200" width="130" height="34" rx="17" fill="#1e1e2e" stroke="#c8a84b" stroke-width="1.2"/>
    <text x="916" y="222" font-family="Arial, sans-serif" font-size="13" fill="#f5d98b" text-anchor="middle" font-weight="600">Async + MongoDB</text>
  </g>

  <!-- Tech stack line -->
  <text x="620" y="278"
        font-family="Arial, sans-serif"
        font-size="13"
        fill="#706858"
        text-anchor="middle"
        letter-spacing="2">Python 3.11  ·  PyMuPDF  ·  Kurigram  ·  Ghostscript  ·  LibreOffice</text>

  <!-- Channel handle -->
  <text x="620" y="312"
        font-family="Georgia, serif"
        font-style="italic"
        font-size="15"
        fill="#a08040"
        text-anchor="middle"
        letter-spacing="1">@roxybasicneedbot1</text>

  <!-- ─── Right decorative mini-doc ─── -->
  <g transform="translate(1020, 80)" class="doc-back">
    <rect x="0" y="0" width="90" height="115" rx="4" fill="#1a1a2a" stroke="#c8a84b" stroke-width="0.8" opacity="0.6"/>
    <rect x="0" y="20" width="45" height="22" rx="4" fill="url(#pdfRed)" opacity="0.7"/>
    <text x="22" y="35" font-family="Arial Black" font-weight="900" font-size="11" fill="#f5d98b" text-anchor="middle">PDF</text>
    <line x1="8" y1="55" x2="82" y2="55" stroke="#c8a84b" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="67" x2="82" y2="67" stroke="#c8a84b" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="79" x2="65" y2="79" stroke="#c8a84b" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="91" x2="75" y2="91" stroke="#c8a84b" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Corner ornaments -->
  <g fill="none" stroke="#c8a84b" stroke-width="1" opacity="0.4">
    <!-- Top-left -->
    <polyline points="18,18 18,42 42,42"/>
    <polyline points="18,18 42,18"/>
    <!-- Top-right -->
    <polyline points="1182,18 1182,42 1158,42"/>
    <polyline points="1182,18 1158,18"/>
    <!-- Bottom-left -->
    <polyline points="18,322 18,298 42,298"/>
    <polyline points="18,322 42,322"/>
    <!-- Bottom-right -->
    <polyline points="1182,322 1182,298 1158,298"/>
    <polyline points="1182,322 1158,322"/>
  </g>
</svg>
