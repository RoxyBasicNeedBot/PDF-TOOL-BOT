<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="divG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#c8a84b;stop-opacity:0"/>
      <stop offset="20%"  style="stop-color:#c8a84b;stop-opacity:0.8"/>
      <stop offset="50%"  style="stop-color:#f5d98b;stop-opacity:1"/>
      <stop offset="80%"  style="stop-color:#c8a84b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c8a84b;stop-opacity:0"/>
    </linearGradient>
    <style>
      @keyframes pulseLine {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      @keyframes spinCenter {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .pLine { animation: pulseLine 3s ease-in-out infinite; }
      .cDot  { animation: spinCenter 8s linear infinite; transform-origin: 600px 6px; }
    </style>
  </defs>
  <rect class="pLine" x="40" y="5" width="1120" height="2" rx="1" fill="url(#divG)"/>
  <g class="cDot">
    <polygon points="600,0 603,6 600,12 597,6" fill="#f5d98b"/>
    <polygon points="594,6 600,9 606,6 600,3" fill="#f5d98b"/>
  </g>
</svg>
